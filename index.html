<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner" role="button" aria-label="Toggle menu" tabindex="0">
    <div class="nav-logo">
      <canvas class="logo-canvas"></canvas>
    </div>
    <span class="nav-brand">ONEBLAST</span>
  </div>

  <!-- MENU GALERIA -->
  <div class="nav-menu">

    <div class="nav-item" data-index="0">
      <div class="nav-card">
        <img src="images/222.jpg">
        <span>Inicio</span>
      </div>
    </div>

    <div class="nav-item" data-index="1">
      <div class="nav-card">
        <img src="images/555.png">
        <span>Productos</span>
      </div>
    </div>

    <div class="nav-item" data-index="2">
      <div class="nav-card">
        <img src="images/444.png">
        <span>About</span>
      </div>
    </div>

    <div class="nav-item" data-index="3">
      <div class="nav-card">
        <img src="images/333.png">
        <span>Contacto</span>
      </div>
    </div>

    

  </div>
</nav>

<!-- Carousel -->
<div class="carousel">
  <div class="arrow prev"><span>&#10094;</span></div>
  <div class="arrow next"><span>&#10095;</span></div>
</div>

<!-- Pagination dots: one per product, built in app.js. Pinned to the
     bottom of the viewport, outside the card, like a footer. -->
<div class="carousel-dots" id="carouselDots"></div>

<!-- Animate lightbox: opened per-product by the Animate button, shows a
     bigger view with a category-specific animation loop (see app.js). -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <canvas class="lightbox-canvas" id="lightboxCanvas"></canvas>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<footer class="site-footer">ONEBLAST &middot; drag or swipe to explore</footer>

<script src="app.js"></script>
</body>
