<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneBlast — 3D Product Showcase</title>
<meta name="description" content="OneBlast — an interactive 3D product showcase. Drag to rotate, swipe through the catalog, explore every product in real time.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/favicon.png" type="image/png">

<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/RGBELoader.js"></script>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner" role="button" aria-label="Toggle menu" tabindex="0">
    <div class="nav-logo">
      <canvas class="logo-canvas"></canvas>
    </div>
    <span class="nav-brand">ONEBLAST</span>
  </div>

  <!-- MENU GALERIA -->
  <div class="nav-menu">

    <div class="nav-item" data-index="0">
      <div class="nav-card">
        <img src="images/222.jpg">
        <span>Inicio</span>
      </div>
    </div>

    <div class="nav-item" data-index="1">
      <div class="nav-card">
        <img src="images/555.png">
        <span>Productos</span>
      </div>
    </div>

    <div class="nav-item" data-index="2">
      <div class="nav-card">
        <img src="images/444.png">
        <span>About</span>
      </div>
    </div>

    <div class="nav-item" data-index="3">
      <div class="nav-card">
        <img src="images/333.png">
        <span>Contacto</span>
      </div>
    </div>

    

  </div>
</nav>

<!-- Carousel -->
<div class="carousel">
  <div class="arrow prev"><span>&#10094;</span></div>
  <div class="arrow next"><span>&#10095;</span></div>
</div>

<!-- Animate lightbox: opened per-product by the Animate button, shows a
     bigger view with a category-specific animation loop (see app.js). -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <canvas class="lightbox-canvas" id="lightboxCanvas"></canvas>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<footer class="site-footer">ONEBLAST &middot; drag or swipe to explore</footer>

<script src="app.js"></script>
</body>
</html>
